<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape Life Sim</title>
  <style>
    :root {
      --panel: rgba(10, 19, 29, 0.78);
      --line: rgba(176, 215, 255, 0.15);
      --text: #e7f3ff;
      --muted: #9db2c6;
      --accent: #5bc0eb;
      --accent2: #f4a261;
      --blur-strength: 0px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: #000;
    }

    .toolbar {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .blur-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      backdrop-filter: blur(var(--blur-strength));
      background: rgba(0, 0, 0, 0.01);
    }

    .controls {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: 10px;
    }

    .field {
      min-width: 150px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: white;
      background: linear-gradient(180deg, var(--accent), #2f80b8);
      cursor: pointer;
    }

    button.alt {
      background: linear-gradient(180deg, var(--accent2), #c4732e);
    }

    input[type="number"] {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 980px) {
      .toolbar {
        right: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="controls">
      <button id="toggleBtn">Pause</button>
      <button id="resetBtn" class="alt">Reset World</button>
      <label class="field">
        Spawn Count
        <input id="spawnInput" type="number" min="15" max="120" step="1" value="45">
      </label>
      <label class="field">
        Chaos
        <input id="chaosInput" type="number" min="0.2" max="1.6" step="0.1" value="0.8">
      </label>
      <label class="field">
        Blur
        <input id="blurInput" type="number" min="0" max="40" step="1" value="0">
      </label>
    </div>
  </div>

  <div class="stage">
    <canvas id="world"></canvas>
    <div class="blur-layer" id="blurLayer"></div>
  </div>

  <script>
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");

    const ui = {
      toggleBtn: document.getElementById("toggleBtn"),
      resetBtn: document.getElementById("resetBtn"),
      spawnInput: document.getElementById("spawnInput"),
      chaosInput: document.getElementById("chaosInput"),
      blurInput: document.getElementById("blurInput"),
      blurLayer: document.getElementById("blurLayer")
    };

    const species = {
      circle: { color: "#ffffff", baseRadius: 7, speed: 1.1, state: "stable" },
      square: { color: "#ffffff", baseRadius: 9, speed: 0.9, state: "stable" },
      triangle: { color: "#ffffff", baseRadius: 8, speed: 1.4, state: "unstable" },
      hex: { color: "#ffffff", baseRadius: 11, speed: 1.0, state: "unstable" }
    };

    const mergeRules = {
      "circle:circle": { chance: 0.18, result: "triangle", bounceMultiplier: 2 },
      "square:square": { chance: 0.18, result: "hex", bounceMultiplier: 2 }
    };

    let sim;

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function pickBaseKind() {
      const roll = Math.random();
      if (roll < 0.34) return "circle";
      if (roll < 0.67) return "square";
      return "triangle";
    }

    function stableStateOf(kind) {
      return species[kind].state;
    }

    function decayLifetimeFrames(kind) {
      if (kind === "hex") return rand(5, 10) * 60;
      if (kind === "triangle") return rand(10, 20) * 60;
      return Number.POSITIVE_INFINITY;
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }

    function createEntity(kind, generation = 1, x, y) {
      const spec = species[kind];
      const angle = rand(0, Math.PI * 2);
      const radius = (spec.baseRadius + generation * 0.8 + rand(-1.2, 1.2)) * 2;
      return {
        id: crypto.randomUUID(),
        kind,
        generation,
        x: x ?? rand(24, canvas.clientWidth - 24),
        y: y ?? rand(24, canvas.clientHeight - 24),
        vx: Math.cos(angle) * spec.speed * rand(0.5, 1.2),
        vy: Math.sin(angle) * spec.speed * rand(0.5, 1.2),
        radius,
        energy: rand(40, 100),
        age: 0,
        cooldown: 0,
        decayAt: decayLifetimeFrames(kind)
      };
    }

    function pushLog(text) {
      sim.log.unshift(text);
      sim.log = sim.log.slice(0, 8);
    }

    function pairKey(aKind, bKind) {
      return [aKind, bKind].sort().join(":");
    }

    function mergeEntities(a, b, kind) {
      const merged = createEntity(kind, Math.max(a.generation, b.generation) + 1, (a.x + b.x) / 2, (a.y + b.y) / 2);
      merged.radius = Math.min(28, Math.sqrt(a.radius * a.radius + b.radius * b.radius) * 0.82);
      merged.energy = Math.min(160, a.energy + b.energy * 0.6);
      merged.vx = (a.vx + b.vx) * 0.5 + rand(-0.6, 0.6);
      merged.vy = (a.vy + b.vy) * 0.5 + rand(-0.6, 0.6);
      merged.cooldown = 25;
      return merged;
    }

    function decayTarget(kind) {
      if (kind === "triangle") return "circle";
      if (kind === "hex") return "square";
      return kind;
    }

    function decayEntity(entity, reason) {
      const oldKind = entity.kind;
      const nextKind = decayTarget(entity.kind);
      if (nextKind === entity.kind) return [entity];
      const generation = Math.max(1, entity.generation - 1);
      const spread = species[nextKind].baseRadius * 1.8;
      const angle = rand(0, Math.PI * 2);
      const dx = Math.cos(angle) * spread;
      const dy = Math.sin(angle) * spread;
      const childA = createEntity(nextKind, generation, entity.x - dx, entity.y - dy);
      const childB = createEntity(nextKind, generation, entity.x + dx, entity.y + dy);
      const repel = 14;
      childA.vx = entity.vx * 0.3 - Math.cos(angle) * repel;
      childA.vy = entity.vy * 0.3 - Math.sin(angle) * repel;
      childB.vx = entity.vx * 0.3 + Math.cos(angle) * repel;
      childB.vy = entity.vy * 0.3 + Math.sin(angle) * repel;
      childA.energy = Math.max(40, entity.energy * 0.45);
      childB.energy = Math.max(40, entity.energy * 0.45);
      childA.cooldown = 32;
      childB.cooldown = 32;
      pushLog(`${oldKind} decayed into ${nextKind}${reason ? " via " + reason : ""}`);
      return [childA, childB];
    }

    function drawEntity(entity) {
      const spec = species[entity.kind];
      const radius = entity.radius * 10;
      const gradient = ctx.createRadialGradient(
        entity.x,
        entity.y,
        0,
        entity.x,
        entity.y,
        radius
      );

      gradient.addColorStop(0, spec.color + "cc");
      gradient.addColorStop(0.55, spec.color + "55");
      gradient.addColorStop(1, spec.color + "00");

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(entity.x, entity.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function bounce(entity) {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      if (entity.x < entity.radius) {
        entity.x = entity.radius;
        entity.vx *= -1;
      } else if (entity.x > width - entity.radius) {
        entity.x = width - entity.radius;
        entity.vx *= -1;
      }

      if (entity.y < entity.radius) {
        entity.y = entity.radius;
        entity.vy *= -1;
      } else if (entity.y > height - entity.radius) {
        entity.y = height - entity.radius;
        entity.vy *= -1;
      }
    }

    function interact(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq) || 0.001;
      const minDist = a.radius + b.radius;
      const sameState = stableStateOf(a.kind) === stableStateOf(b.kind);
      const forceSign = sameState ? 1 : -1;

      if (dist < 180) {
        const distanceFactor = 1 - dist / 180;
        const force = forceSign * sim.chaos * 0.09 * distanceFactor;
        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;
        a.vx += fx;
        a.vy += fy;
        b.vx -= fx;
        b.vy -= fy;

        if (!sameState && dist < 80) {
          const repelBoost = sim.chaos * 0.13 * (1 - dist / 80);
          a.vx -= (dx / dist) * repelBoost;
          a.vy -= (dy / dist) * repelBoost;
          b.vx += (dx / dist) * repelBoost;
          b.vy += (dy / dist) * repelBoost;
        }
      }

      if (dist < minDist) {
        sim.collisions += 1;
        const overlap = (minDist - dist) * 0.5;
        const nx = dx / dist;
        const ny = dy / dist;

        a.x -= nx * overlap;
        a.y -= ny * overlap;
        b.x += nx * overlap;
        b.y += ny * overlap;

        let impulse = 0.9;
        const dvx = b.vx - a.vx;
        const dvy = b.vy - a.vy;
        const mergeRule = mergeRules[pairKey(a.kind, b.kind)];

        if (pairKey(a.kind, b.kind) === "circle:hex") {
          const blue = a.kind === "circle" ? a : b;
          const red = a.kind === "hex" ? a : b;
          const launch = 3.6;
          blue.vx -= nx * launch;
          blue.vy -= ny * launch;
          return {
            removeIds: [red.id],
            additions: [
              ...decayEntity(red, "blue-red collision")
            ]
          };
        } else if (pairKey(a.kind, b.kind) === "square:triangle") {
          const green = a.kind === "square" ? a : b;
          const orange = a.kind === "triangle" ? a : b;
          const launch = 3.6;
          green.vx -= nx * launch;
          green.vy -= ny * launch;
          return {
            removeIds: [orange.id],
            additions: [
              ...decayEntity(orange, "green-orange collision")
            ]
          };
        } else if (mergeRule && a.cooldown <= 0 && b.cooldown <= 0 && Math.random() < mergeRule.chance) {
          return {
            removeIds: [a.id, b.id],
            additions: [mergeEntities(a, b, mergeRule.result)]
          };
        } else if (mergeRule) {
          impulse *= mergeRule.bounceMultiplier;
        }

        const impact = (dvx * nx + dvy * ny) * impulse;
        a.vx += impact * nx;
        a.vy += impact * ny;
        b.vx -= impact * nx;
        b.vy -= impact * ny;
      }

      return null;
    }

    function updateEntity(entity) {
      const jitter = sim.chaos * 0.012;
      entity.vx += rand(-jitter, jitter);
      entity.vy += rand(-jitter, jitter);
      entity.vx *= 0.992;
      entity.vy *= 0.992;

      const cap = 2.8 + entity.generation * 0.1;
      const speed = Math.hypot(entity.vx, entity.vy);
      if (speed > cap) {
        entity.vx = (entity.vx / speed) * cap;
        entity.vy = (entity.vy / speed) * cap;
      }

      entity.x += entity.vx;
      entity.y += entity.vy;
      entity.age += 1;
      entity.cooldown -= 1;
      if (entity.age >= entity.decayAt) {
        return decayEntity(entity, "instability");
      }
      bounce(entity);
      return null;
    }

    function spawnWorld() {
      sim.entities = [];
      sim.collisions = 0;
      sim.merges = 0;
      sim.generationPeak = 1;
      sim.log = [];
      const count = Number(ui.spawnInput.value);
      for (let i = 0; i < count; i += 1) {
        sim.entities.push(createEntity(pickBaseKind()));
      }
      pushLog(`seeded ${count} base entities`);
    }

    function resetSim() {
      sim = {
        entities: [],
        paused: false,
        collisions: 0,
        merges: 0,
        generationPeak: 1,
        chaos: Number(ui.chaosInput.value),
        log: []
      };
      spawnWorld();
    }

    function step() {
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      const entities = sim.entities;
      const additions = [];
      const removed = new Set();

      for (let i = 0; i < entities.length; i += 1) {
        const a = entities[i];
        if (removed.has(a.id)) continue;

        const decayChildren = updateEntity(a);
        if (decayChildren) {
          removed.add(a.id);
          additions.push(...decayChildren);
          continue;
        }

        for (let j = i + 1; j < entities.length; j += 1) {
          const b = entities[j];
          if (removed.has(b.id)) continue;
          const outcome = interact(a, b);
          if (outcome) {
            for (const id of outcome.removeIds) removed.add(id);
            additions.push(...outcome.additions);
            if (outcome.additions.length === 1) {
              const merged = outcome.additions[0];
              sim.merges += 1;
              sim.generationPeak = Math.max(sim.generationPeak, merged.generation);
              pushLog(`${a.kind} + ${b.kind} -> ${merged.kind} g${merged.generation}`);
            }
            break;
          }
        }
      }

      let next = entities.filter(entity => !removed.has(entity.id));
      next.push(...additions);

      if (next.length < 8) {
        const refill = Math.max(4, Math.floor(Number(ui.spawnInput.value) * 0.15));
        for (let i = 0; i < refill; i += 1) next.push(createEntity(pickBaseKind()));
        pushLog(`population collapsed, spawned ${refill} new entities`);
      }

      sim.entities = next.slice(0, 260);

      for (const entity of sim.entities) {
        drawEntity(entity);
      }
    }

    function frame() {
      if (!sim.paused) step();
      requestAnimationFrame(frame);
    }

    ui.toggleBtn.addEventListener("click", () => {
      sim.paused = !sim.paused;
      ui.toggleBtn.textContent = sim.paused ? "Resume" : "Pause";
    });

    ui.resetBtn.addEventListener("click", resetSim);

    ui.spawnInput.addEventListener("change", () => {
      const next = Math.max(15, Math.min(120, Number(ui.spawnInput.value) || 45));
      ui.spawnInput.value = String(next);
    });

    ui.chaosInput.addEventListener("change", () => {
      const next = Math.max(0.2, Math.min(1.6, Number(ui.chaosInput.value) || 0.8));
      ui.chaosInput.value = next.toFixed(1);
      sim.chaos = next;
    });

    ui.blurInput.addEventListener("change", () => {
      const next = Math.max(0, Math.min(40, Number(ui.blurInput.value) || 0));
      ui.blurInput.value = String(next);
      ui.blurLayer.style.setProperty("--blur-strength", `${next}px`);
    });

    window.addEventListener("resize", resize);
    ui.blurLayer.style.setProperty("--blur-strength", `${Number(ui.blurInput.value) || 0}px`);
    resize();
    resetSim();
    frame();
  </script>
</body>
</html>
