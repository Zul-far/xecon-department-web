<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape Life Sim</title>
  <style>
    :root {
      --bg0: #08111b;
      --bg1: #0f2130;
      --panel: rgba(10, 19, 29, 0.78);
      --line: rgba(176, 215, 255, 0.15);
      --text: #e7f3ff;
      --muted: #9db2c6;
      --accent: #5bc0eb;
      --accent2: #f4a261;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(91, 192, 235, 0.12), transparent 26%),
        radial-gradient(circle at 80% 0%, rgba(244, 162, 97, 0.14), transparent 22%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
    }

    .wrap {
      width: min(1200px, calc(100% - 24px));
      margin: 18px auto;
    }

    .topbar {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(10px);
    }

    .title h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 14px;
    }

    .stage,
    .panel {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .stage {
      position: relative;
      min-height: 70vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px),
        radial-gradient(circle at center, rgba(91, 192, 235, 0.07), transparent 55%);
      background-size: 28px 28px, 28px 28px, auto;
    }

    .panel {
      padding: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .card {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255,255,255,0.07);
    }

    .card strong {
      display: block;
      font-size: 1.15rem;
      margin-top: 4px;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    button,
    input[type="range"] {
      width: 100%;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: white;
      background: linear-gradient(180deg, var(--accent), #2f80b8);
      cursor: pointer;
    }

    button.alt {
      background: linear-gradient(180deg, var(--accent2), #c4732e);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .legend,
    .log {
      display: grid;
      gap: 8px;
    }

    .legend-item,
    .log-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      font-size: 0.92rem;
    }

    .swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-right: 8px;
      vertical-align: middle;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 58vh;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="topbar">
      <div class="title">
        <h1>Shape Life Sim</h1>
        <p>Random moving forms collide, bond, split, and evolve into more complex patterns.</p>
      </div>
    </section>

    <section class="layout">
      <div class="stage">
        <canvas id="world"></canvas>
      </div>

      <aside class="panel">
        <div class="stats">
          <div class="card">Entities<strong id="entityCount">0</strong></div>
          <div class="card">Collisions<strong id="collisionCount">0</strong></div>
          <div class="card">Merges<strong id="mergeCount">0</strong></div>
          <div class="card">Generation<strong id="generationCount">1</strong></div>
        </div>

        <div class="controls">
          <button id="toggleBtn">Pause</button>
          <button id="resetBtn" class="alt">Reset World</button>

          <label>
            Spawn Count: <span id="spawnValue">45</span>
            <input id="spawnSlider" type="range" min="15" max="120" value="45">
          </label>

          <label>
            Chaos: <span id="chaosValue">0.80</span>
            <input id="chaosSlider" type="range" min="20" max="160" value="80">
          </label>
        </div>

        <div class="legend">
          <div class="legend-item"><span class="swatch" style="background:#5bc0eb"></span>Circle: stable drifter</div>
          <div class="legend-item"><span class="swatch" style="background:#7dd87d"></span>Square: strong magnetism</div>
          <div class="legend-item"><span class="swatch" style="background:#f4a261"></span>Triangle: aggressive mover</div>
          <div class="legend-item"><span class="swatch" style="background:#e76f51"></span>Hex: fused higher-form</div>
        </div>

        <div style="height:12px"></div>
        <div class="log" id="log"></div>
      </aside>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");

    const ui = {
      entityCount: document.getElementById("entityCount"),
      collisionCount: document.getElementById("collisionCount"),
      mergeCount: document.getElementById("mergeCount"),
      generationCount: document.getElementById("generationCount"),
      toggleBtn: document.getElementById("toggleBtn"),
      resetBtn: document.getElementById("resetBtn"),
      spawnSlider: document.getElementById("spawnSlider"),
      spawnValue: document.getElementById("spawnValue"),
      chaosSlider: document.getElementById("chaosSlider"),
      chaosValue: document.getElementById("chaosValue"),
      log: document.getElementById("log")
    };

    const species = {
      circle: { color: "#5bc0eb", sides: 0, baseRadius: 7, speed: 1.1, mergeBias: 0.20 },
      square: { color: "#7dd87d", sides: 4, baseRadius: 9, speed: 0.9, mergeBias: 0.34 },
      triangle: { color: "#f4a261", sides: 3, baseRadius: 8, speed: 1.4, mergeBias: 0.25 },
      hex: { color: "#e76f51", sides: 6, baseRadius: 11, speed: 1.0, mergeBias: 0.5 }
    };

    const pairRules = {
      "circle:circle": { force: 0.55, mergeChance: 0.10, result: "circle" },
      "circle:square": { force: 0.95, mergeChance: 0.24, result: "hex" },
      "circle:triangle": { force: -1.1, mergeChance: 0.05, result: "triangle" },
      "circle:hex": { force: 0.45, mergeChance: 0.16, result: "hex" },
      "square:square": { force: -0.65, mergeChance: 0.14, result: "square" },
      "square:triangle": { force: 1.15, mergeChance: 0.28, result: "hex" },
      "square:hex": { force: -0.85, mergeChance: 0.08, result: "hex" },
      "triangle:triangle": { force: -1.35, mergeChance: 0.09, result: "triangle" },
      "triangle:hex": { force: 0.9, mergeChance: 0.22, result: "hex" },
      "hex:hex": { force: -0.25, mergeChance: 0.18, result: "hex" }
    };

    let sim;

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function pickBaseKind() {
      const roll = Math.random();
      if (roll < 0.34) return "circle";
      if (roll < 0.67) return "square";
      return "triangle";
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }

    function createEntity(kind, generation = 1, x, y) {
      const spec = species[kind];
      const angle = rand(0, Math.PI * 2);
      const radius = spec.baseRadius + generation * 0.8 + rand(-1.2, 1.2);
      return {
        id: crypto.randomUUID(),
        kind,
        generation,
        x: x ?? rand(24, canvas.clientWidth - 24),
        y: y ?? rand(24, canvas.clientHeight - 24),
        vx: Math.cos(angle) * spec.speed * rand(0.5, 1.2),
        vy: Math.sin(angle) * spec.speed * rand(0.5, 1.2),
        radius,
        energy: rand(40, 100),
        age: 0,
        cooldown: 0
      };
    }

    function pushLog(text) {
      sim.log.unshift(text);
      sim.log = sim.log.slice(0, 8);
      ui.log.innerHTML = sim.log.map(item => `<div class="log-item">${item}</div>`).join("");
    }

    function pairKey(aKind, bKind) {
      return [aKind, bKind].sort().join(":");
    }

    function ruleFor(a, b) {
      return pairRules[pairKey(a.kind, b.kind)] ?? { force: 0, mergeChance: 0.04, result: "hex" };
    }

    function mergedKind(a, b, rule) {
      if (a.generation + b.generation > 7) return "hex";
      if (a.kind === "hex" || b.kind === "hex") return "hex";
      return rule.result;
    }

    function mergeEntities(a, b, rule) {
      const kind = mergedKind(a, b, rule);
      const merged = createEntity(kind, Math.max(a.generation, b.generation) + 1, (a.x + b.x) / 2, (a.y + b.y) / 2);
      merged.radius = Math.min(28, Math.sqrt(a.radius * a.radius + b.radius * b.radius) * 0.82);
      merged.energy = Math.min(160, a.energy + b.energy * 0.6);
      merged.vx = (a.vx + b.vx) * 0.5 + rand(-0.6, 0.6);
      merged.vy = (a.vy + b.vy) * 0.5 + rand(-0.6, 0.6);
      merged.cooldown = 25;
      return merged;
    }

    function splitEntity(entity) {
      if (entity.generation < 3 || entity.energy < 115 || Math.random() > 0.004) {
        return [entity];
      }

      const childKind = entity.kind === "hex" ? pickBaseKind() : entity.kind;
      const offset = entity.radius * 0.8;
      const childA = createEntity(childKind, Math.max(1, entity.generation - 1), entity.x - offset, entity.y);
      const childB = createEntity(childKind, Math.max(1, entity.generation - 1), entity.x + offset, entity.y);
      childA.vx += rand(-1.4, -0.4);
      childB.vx += rand(0.4, 1.4);
      childA.vy += rand(-1, 1);
      childB.vy += rand(-1, 1);
      pushLog(`${entity.kind} split into two ${childKind}s`);
      return [childA, childB];
    }

    function drawEntity(entity) {
      const spec = species[entity.kind];
      ctx.save();
      ctx.translate(entity.x, entity.y);
      ctx.rotate(entity.age * 0.01);
      ctx.fillStyle = spec.color;
      ctx.globalAlpha = 0.78;
      ctx.shadowBlur = 18;
      ctx.shadowColor = spec.color;

      if (spec.sides === 0) {
        ctx.beginPath();
        ctx.arc(0, 0, entity.radius, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        for (let i = 0; i < spec.sides; i += 1) {
          const angle = (Math.PI * 2 * i) / spec.sides - Math.PI / 2;
          const px = Math.cos(angle) * entity.radius;
          const py = Math.sin(angle) * entity.radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    function bounce(entity) {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      if (entity.x < entity.radius) {
        entity.x = entity.radius;
        entity.vx *= -1;
      } else if (entity.x > width - entity.radius) {
        entity.x = width - entity.radius;
        entity.vx *= -1;
      }

      if (entity.y < entity.radius) {
        entity.y = entity.radius;
        entity.vy *= -1;
      } else if (entity.y > height - entity.radius) {
        entity.y = height - entity.radius;
        entity.vy *= -1;
      }
    }

    function interact(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq) || 0.001;
      const minDist = a.radius + b.radius;
      const rule = ruleFor(a, b);

      if (dist < 180) {
        const distanceFactor = 1 - dist / 180;
        const force = rule.force * sim.chaos * 0.07 * distanceFactor;
        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;
        a.vx += fx;
        a.vy += fy;
        b.vx -= fx;
        b.vy -= fy;

        if (rule.force < 0 && dist < 70) {
          const repelBoost = Math.abs(rule.force) * sim.chaos * 0.09 * (1 - dist / 70);
          a.vx -= (dx / dist) * repelBoost;
          a.vy -= (dy / dist) * repelBoost;
          b.vx += (dx / dist) * repelBoost;
          b.vy += (dy / dist) * repelBoost;
        }
      }

      if (dist < minDist) {
        sim.collisions += 1;
        const overlap = (minDist - dist) * 0.5;
        const nx = dx / dist;
        const ny = dy / dist;

        a.x -= nx * overlap;
        a.y -= ny * overlap;
        b.x += nx * overlap;
        b.y += ny * overlap;

        const impulse = 0.9;
        const dvx = b.vx - a.vx;
        const dvy = b.vy - a.vy;
        const impact = (dvx * nx + dvy * ny) * impulse;
        a.vx += impact * nx;
        a.vy += impact * ny;
        b.vx -= impact * nx;
        b.vy -= impact * ny;

        const generationBoost = (a.generation + b.generation) * 0.015;
        const mergeChance = rule.mergeChance + generationBoost + (species[a.kind].mergeBias + species[b.kind].mergeBias) * 0.03;
        if (a.cooldown <= 0 && b.cooldown <= 0 && Math.random() < mergeChance) {
          return mergeEntities(a, b, rule);
        }
      }

      return null;
    }

    function updateEntity(entity) {
      const jitter = sim.chaos * 0.012;
      entity.vx += rand(-jitter, jitter);
      entity.vy += rand(-jitter, jitter);
      entity.vx *= 0.992;
      entity.vy *= 0.992;

      const cap = 2.8 + entity.generation * 0.1;
      const speed = Math.hypot(entity.vx, entity.vy);
      if (speed > cap) {
        entity.vx = (entity.vx / speed) * cap;
        entity.vy = (entity.vy / speed) * cap;
      }

      entity.x += entity.vx;
      entity.y += entity.vy;
      entity.age += 1;
      entity.energy -= 0.05 + entity.generation * 0.01;
      entity.cooldown -= 1;
      bounce(entity);
    }

    function spawnWorld() {
      sim.entities = [];
      sim.collisions = 0;
      sim.merges = 0;
      sim.generationPeak = 1;
      sim.log = [];
      const count = Number(ui.spawnSlider.value);
      for (let i = 0; i < count; i += 1) {
        sim.entities.push(createEntity(pickBaseKind()));
      }
      pushLog(`seeded ${count} base entities`);
    }

    function resetSim() {
      sim = {
        entities: [],
        paused: false,
        collisions: 0,
        merges: 0,
        generationPeak: 1,
        chaos: Number(ui.chaosSlider.value) / 100,
        log: []
      };
      spawnWorld();
    }

    function step() {
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      const entities = sim.entities;
      const additions = [];
      const removed = new Set();

      for (let i = 0; i < entities.length; i += 1) {
        const a = entities[i];
        if (removed.has(a.id)) continue;

        updateEntity(a);

        for (let j = i + 1; j < entities.length; j += 1) {
          const b = entities[j];
          if (removed.has(b.id)) continue;
          const merged = interact(a, b);
          if (merged) {
            removed.add(a.id);
            removed.add(b.id);
            additions.push(merged);
            sim.merges += 1;
            sim.generationPeak = Math.max(sim.generationPeak, merged.generation);
            pushLog(`${a.kind} + ${b.kind} -> ${merged.kind} g${merged.generation}`);
            break;
          }
        }
      }

      let next = entities.filter(entity => !removed.has(entity.id) && entity.energy > 0 && entity.age < 5000);
      for (const entity of next) {
        const result = splitEntity(entity);
        if (result.length === 2) {
          removed.add(entity.id);
          additions.push(...result);
        }
      }
      next = next.filter(entity => !removed.has(entity.id));
      next.push(...additions);

      if (next.length < 8) {
        const refill = Math.max(4, Math.floor(Number(ui.spawnSlider.value) * 0.15));
        for (let i = 0; i < refill; i += 1) next.push(createEntity(pickBaseKind()));
        pushLog(`population collapsed, spawned ${refill} new entities`);
      }

      sim.entities = next.slice(0, 260);

      for (const entity of sim.entities) {
        drawEntity(entity);
      }

      ui.entityCount.textContent = sim.entities.length;
      ui.collisionCount.textContent = sim.collisions;
      ui.mergeCount.textContent = sim.merges;
      ui.generationCount.textContent = sim.generationPeak;
    }

    function frame() {
      if (!sim.paused) step();
      requestAnimationFrame(frame);
    }

    ui.toggleBtn.addEventListener("click", () => {
      sim.paused = !sim.paused;
      ui.toggleBtn.textContent = sim.paused ? "Resume" : "Pause";
    });

    ui.resetBtn.addEventListener("click", resetSim);

    ui.spawnSlider.addEventListener("input", () => {
      ui.spawnValue.textContent = ui.spawnSlider.value;
    });

    ui.chaosSlider.addEventListener("input", () => {
      ui.chaosValue.textContent = (Number(ui.chaosSlider.value) / 100).toFixed(2);
      sim.chaos = Number(ui.chaosSlider.value) / 100;
    });

    window.addEventListener("resize", resize);

    ui.spawnValue.textContent = ui.spawnSlider.value;
    ui.chaosValue.textContent = (Number(ui.chaosSlider.value) / 100).toFixed(2);
    resize();
    resetSim();
    frame();
  </script>
</body>
</html>
