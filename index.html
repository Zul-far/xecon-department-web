<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to the Xecon Department</title>
  <style>
    :root {
      --outline: rgba(245, 249, 255, 0.95);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .welcome {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: 5vw;
      pointer-events: none;
    }

    .welcome-title {
      --stroke-width: 1.5px;
      margin: 0;
      isolation: isolate;
      font-family: "Bahnschrift", "Franklin Gothic Medium", sans-serif;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: var(--stroke-width) var(--outline);
    }

    .welcome-content {
      display: grid;
      justify-items: center;
      gap: clamp(24px, 4vh, 48px);
    }

    .destinations {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .destination-link {
      pointer-events: auto;
      min-width: 130px;
      padding: 16px 28px;
      border: 1px solid rgba(245, 249, 255, 0.65);
      background: rgba(0, 0, 0, 0.78);
      color: #f5f9ff;
      font: 600 14px "Bahnschrift", "Franklin Gothic Medium", sans-serif;
      letter-spacing: 0.16em;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .destination-link:hover {
      background: #000;
      border-color: #fff;
    }

    .destination-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .welcome-title span {
      position: relative;
      display: block;
      white-space: nowrap;
    }

    .welcome-title span::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      z-index: -1;
      -webkit-text-stroke: calc(var(--stroke-width) + 2px) rgba(0, 0, 0, 0.8);
    }

    .welcome-intro {
      --stroke-width: 1px;
      margin-bottom: 0.6em;
      font-size: clamp(1rem, 3.5vw, 3.75rem);
      line-height: 1.2;
      letter-spacing: 0.22em;
      -webkit-text-stroke-width: var(--stroke-width);
    }

    .welcome-name {
      font-size: clamp(4.5rem, min(24vw, 38vh), 25rem);
      line-height: 0.94;
      letter-spacing: 0.015em;
    }

    .welcome-department {
      margin-top: 0.15em;
      font-size: clamp(1.75rem, min(11.8vw, 19vh), 12.5rem);
      line-height: 1.05;
      letter-spacing: 0.025em;
    }

    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    @media (max-width: 600px) {
      .welcome-title {
        --stroke-width: 1px;
      }
    }

    @media (max-height: 500px) and (min-width: 601px) {
      .welcome-intro { font-size: 1rem; }
      .welcome-name { font-size: min(24vw, 28vh); }
      .welcome-department { font-size: min(11.8vw, 14vh); }
      .welcome-content { gap: 20px; }
    }
  </style>
</head>
<body>
  <main class="welcome">
    <div class="welcome-content">
    <h1 class="welcome-title" aria-label="Welcome to the Xecon Department">
      <span class="welcome-intro" data-text="Welcome to the" aria-hidden="true">Welcome to the</span>
      <span class="welcome-name" data-text="Xecon" aria-hidden="true">Xecon</span>
      <span class="welcome-department" data-text="Department" aria-hidden="true">Department</span>
    </h1>
    <nav class="destinations" aria-label="Explore Xecon">
      <a class="destination-link" href="orbital-defense.html">Game</a>
      <a class="destination-link" href="gallery.html">Gallery</a>
    </nav>
    </div>
  </main>

  <div class="stage">
    <canvas id="world" aria-hidden="true"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");

    const SETTINGS = Object.freeze({ spawnCount: 18, chaos: 1.6, collisionScale: 2, blobScale: 40 });

    const species = {
      circle: { color: "#3f8fb1", baseRadius: 7, speed: 1.1, state: "stable" },
      square: { color: "#24988d", baseRadius: 9, speed: 0.9, state: "stable" },
      triangle: { color: "#bd7a43", baseRadius: 8, speed: 1.4, state: "unstable" },
      hex: { color: "#b14f3d", baseRadius: 11, speed: 1.0, state: "unstable" }
    };

    const mergeRules = {
      "circle:circle": { chance: 0.18, result: "triangle", bounceMultiplier: 2 },
      "square:square": { chance: 0.18, result: "hex", bounceMultiplier: 2 }
    };

    const MOTION_SPEED = 2;
    const PHYSICS_STEP = 1 / 120;
    const SPRITE_RADIUS = 128;
    const SPRITE_PADDING = 2;
    const blobSprites = Object.fromEntries(
      Object.entries(species).map(([kind, spec]) => [kind, createBlobSprite(spec.color)])
    );
    let sim;
    let visualRadiusScale = 1;
    let lastFrameTime = null;
    let accumulatedTime = 0;

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function pickBaseKind() {
      const roll = Math.random();
      if (roll < 0.34) return "circle";
      if (roll < 0.67) return "square";
      return "triangle";
    }

    function pickUnstableKind() {
      return Math.random() < 0.5 ? "triangle" : "hex";
    }

    function stableStateOf(kind) {
      return species[kind].state;
    }

    function decayLifetimeSeconds(kind) {
      if (kind === "hex") return rand(5, 10);
      if (kind === "triangle") return rand(10, 20);
      return Number.POSITIVE_INFINITY;
    }

    function resize() {
      visualRadiusScale = window.matchMedia(
        "(max-width: 600px), (pointer: coarse) and (max-height: 600px)"
      ).matches ? 0.4 : 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      if (sim) render();
    }

    function createEntity(kind, generation = 1, x, y) {
      const spec = species[kind];
      const angle = rand(0, Math.PI * 2);
      const radius = (spec.baseRadius + generation * 0.8 + rand(-1.2, 1.2)) * sim.collisionScale;
      return {
        id: crypto.randomUUID(),
        kind,
        generation,
        x: x ?? rand(24, canvas.clientWidth - 24),
        y: y ?? rand(24, canvas.clientHeight - 24),
        vx: Math.cos(angle) * spec.speed * rand(0.5, 1.2),
        vy: Math.sin(angle) * spec.speed * rand(0.5, 1.2),
        radius,
        energy: rand(40, 100),
        age: 0,
        cooldown: 0,
        burstSpeed: 0,
        decayAt: decayLifetimeSeconds(kind)
      };
    }

    function pushLog(text) {
      sim.log.unshift(text);
      sim.log = sim.log.slice(0, 8);
    }

    function pairKey(aKind, bKind) {
      return [aKind, bKind].sort().join(":");
    }

    function mergeEntities(a, b, kind) {
      const merged = createEntity(kind, Math.max(a.generation, b.generation) + 1, (a.x + b.x) / 2, (a.y + b.y) / 2);
      merged.radius = Math.min(28, Math.sqrt(a.radius * a.radius + b.radius * b.radius) * 0.82);
      merged.energy = Math.min(160, a.energy + b.energy * 0.6);
      merged.vx = (a.vx + b.vx) * 0.5 + rand(-0.6, 0.6);
      merged.vy = (a.vy + b.vy) * 0.5 + rand(-0.6, 0.6);
      merged.cooldown = 25;
      return merged;
    }

    function decayTarget(kind) {
      if (kind === "triangle") return "circle";
      if (kind === "hex") return "square";
      return kind;
    }

    function decayEntity(entity, reason) {
      const oldKind = entity.kind;
      const nextKind = decayTarget(entity.kind);
      if (nextKind === entity.kind) return [entity];
      const generation = Math.max(1, entity.generation - 1);
      const spread = species[nextKind].baseRadius * 1.8;
      const angle = rand(0, Math.PI * 2);
      const dx = Math.cos(angle) * spread;
      const dy = Math.sin(angle) * spread;
      const childA = createEntity(nextKind, generation, entity.x - dx, entity.y - dy);
      const childB = createEntity(nextKind, generation, entity.x + dx, entity.y + dy);
      const repel = 14;
      childA.vx = entity.vx * 0.3 - Math.cos(angle) * repel;
      childA.vy = entity.vy * 0.3 - Math.sin(angle) * repel;
      childB.vx = entity.vx * 0.3 + Math.cos(angle) * repel;
      childB.vy = entity.vy * 0.3 + Math.sin(angle) * repel;
      childA.energy = Math.max(40, entity.energy * 0.45);
      childB.energy = Math.max(40, entity.energy * 0.45);
      childA.cooldown = 32;
      childB.cooldown = 32;
      childA.burstSpeed = repel;
      childB.burstSpeed = repel;
      pushLog(`${oldKind} decayed into ${nextKind}${reason ? " via " + reason : ""}`);
      return [childA, childB];
    }

    function createBlobSprite(color) {
      // Cache the fade once. Transparent padding prevents a hard texture edge.
      const sprite = document.createElement("canvas");
      const center = SPRITE_RADIUS + SPRITE_PADDING;
      sprite.width = sprite.height = center * 2;
      const spriteCtx = sprite.getContext("2d");
      const gradient = spriteCtx.createRadialGradient(center, center, 0, center, center, SPRITE_RADIUS);
      gradient.addColorStop(0, color + "aa");
      gradient.addColorStop(0.35, color + "4a");
      gradient.addColorStop(0.7, color + "14");
      gradient.addColorStop(0.9, color + "04");
      gradient.addColorStop(1, color + "00");
      spriteCtx.fillStyle = gradient;
      spriteCtx.fillRect(0, 0, sprite.width, sprite.height);
      return sprite;
    }

    function drawEntity(entity) {
      const radius = entity.radius * sim.blobScale * visualRadiusScale;
      const paddedRadius = radius * (SPRITE_RADIUS + SPRITE_PADDING) / SPRITE_RADIUS;
      ctx.drawImage(blobSprites[entity.kind], entity.x - paddedRadius, entity.y - paddedRadius,
        paddedRadius * 2, paddedRadius * 2);
    }

    function bounce(entity) {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      if (entity.x < entity.radius) {
        entity.x = entity.radius;
        entity.vx = Math.abs(entity.vx);
      } else if (entity.x > width - entity.radius) {
        entity.x = width - entity.radius;
        entity.vx = -Math.abs(entity.vx);
      }

      if (entity.y < entity.radius) {
        entity.y = entity.radius;
        entity.vy = Math.abs(entity.vy);
      } else if (entity.y > height - entity.radius) {
        entity.y = height - entity.radius;
        entity.vy = -Math.abs(entity.vy);
      }
    }

    function interact(a, b, motionStep = 1) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq);
      const nx = dist > 0 ? dx / dist : 1;
      const ny = dist > 0 ? dy / dist : 0;
      const minDist = a.radius + b.radius;
      const sameState = stableStateOf(a.kind) === stableStateOf(b.kind);
      const forceSign = sameState ? 1 : -1;

      if (dist < 180) {
        const distanceFactor = 1 - dist / 180;
        const force = forceSign * sim.chaos * 0.09 * distanceFactor * motionStep;
        const fx = nx * force;
        const fy = ny * force;
        a.vx += fx;
        a.vy += fy;
        b.vx -= fx;
        b.vy -= fy;

        if (!sameState && dist < 80) {
          const repelBoost = sim.chaos * 0.13 * (1 - dist / 80) * motionStep;
          a.vx -= nx * repelBoost;
          a.vy -= ny * repelBoost;
          b.vx += nx * repelBoost;
          b.vy += ny * repelBoost;
        }
      }

      if (dist < minDist) {
        sim.collisions += 1;
        const overlap = (minDist - dist) * 0.5;
        a.x -= nx * overlap;
        a.y -= ny * overlap;
        b.x += nx * overlap;
        b.y += ny * overlap;

        let impulse = 0.9;
        const dvx = b.vx - a.vx;
        const dvy = b.vy - a.vy;
        const mergeRule = mergeRules[pairKey(a.kind, b.kind)];

        if (pairKey(a.kind, b.kind) === "circle:hex") {
          const blue = a.kind === "circle" ? a : b;
          const red = a.kind === "hex" ? a : b;
          const launch = 3.6;
          const direction = blue === a ? -1 : 1;
          blue.vx += nx * launch * direction;
          blue.vy += ny * launch * direction;
          blue.burstSpeed = Math.max(blue.burstSpeed, launch);
          return {
            removeIds: [red.id],
            additions: [
              ...decayEntity(red, "blue-red collision")
            ]
          };
        } else if (pairKey(a.kind, b.kind) === "square:triangle") {
          const green = a.kind === "square" ? a : b;
          const orange = a.kind === "triangle" ? a : b;
          const launch = 3.6;
          const direction = green === a ? -1 : 1;
          green.vx += nx * launch * direction;
          green.vy += ny * launch * direction;
          green.burstSpeed = Math.max(green.burstSpeed, launch);
          return {
            removeIds: [orange.id],
            additions: [
              ...decayEntity(orange, "green-orange collision")
            ]
          };
        } else if (mergeRule && a.cooldown <= 0 && b.cooldown <= 0 && Math.random() < mergeRule.chance) {
          return {
            removeIds: [a.id, b.id],
            additions: [mergeEntities(a, b, mergeRule.result)]
          };
        } else if (mergeRule) {
          impulse *= mergeRule.bounceMultiplier;
        }

        // Separate overlaps without pulling already departing particles together.
        const impact = Math.min(0, dvx * nx + dvy * ny) * impulse;
        a.vx += impact * nx;
        a.vy += impact * ny;
        b.vx -= impact * nx;
        b.vy -= impact * ny;
      }

      return null;
    }

    function updateEntity(entity, deltaSeconds) {
      const motionStep = deltaSeconds * 60 * MOTION_SPEED;
      const jitter = sim.chaos * 0.012 * Math.sqrt(motionStep);
      entity.vx += rand(-jitter, jitter);
      entity.vy += rand(-jitter, jitter);
      const drag = Math.pow(0.992, motionStep);
      entity.vx *= drag;
      entity.vy *= drag;

      const cap = 2.8 + entity.generation * 0.1 + entity.burstSpeed;
      const speed = Math.hypot(entity.vx, entity.vy);
      if (speed > cap) {
        entity.vx = (entity.vx / speed) * cap;
        entity.vy = (entity.vy / speed) * cap;
      }

      entity.x += entity.vx * motionStep;
      entity.y += entity.vy * motionStep;
      entity.burstSpeed *= Math.pow(0.97, motionStep);
      entity.age += deltaSeconds;
      entity.cooldown = Math.max(0, entity.cooldown - deltaSeconds * 60);
      if (entity.age >= entity.decayAt) {
        return decayEntity(entity, "instability");
      }
      bounce(entity);
      return null;
    }

    function spawnWorld() {
      sim.entities = [];
      sim.collisions = 0;
      sim.merges = 0;
      sim.generationPeak = 1;
      sim.log = [];
      const count = sim.spawnCount;
      for (let i = 0; i < count; i += 1) {
        sim.entities.push(createEntity(pickUnstableKind()));
      }
      pushLog(`seeded ${count} unstable entities`);
    }

    function resetSim() {
      sim = {
        entities: [],
        paused: false,
        collisions: 0,
        merges: 0,
        generationPeak: 1,
        ...SETTINGS,
        log: []
      };
      spawnWorld();
      lastFrameTime = null;
      accumulatedTime = 0;
      render();
    }

    function advancePhysics(deltaSeconds) {
      const motionStep = deltaSeconds * 60 * MOTION_SPEED;
      const entities = sim.entities;
      const additions = [];
      const removed = new Set();

      // Advance all positions to the same time before resolving pairs.
      for (const entity of entities) {
        const decayChildren = updateEntity(entity, deltaSeconds);
        if (decayChildren) {
          removed.add(entity.id);
          additions.push(...decayChildren);
        }
      }

      for (let i = 0; i < entities.length; i += 1) {
        const a = entities[i];
        if (removed.has(a.id)) continue;

        for (let j = i + 1; j < entities.length; j += 1) {
          const b = entities[j];
          if (removed.has(b.id)) continue;
          const outcome = interact(a, b, motionStep);
          if (outcome) {
            for (const id of outcome.removeIds) removed.add(id);
            additions.push(...outcome.additions);
            if (outcome.additions.length === 1) {
              const merged = outcome.additions[0];
              sim.merges += 1;
              sim.generationPeak = Math.max(sim.generationPeak, merged.generation);
              pushLog(`${a.kind} + ${b.kind} -> ${merged.kind} g${merged.generation}`);
            }
            break;
          }
        }
      }

      let next = entities.filter(entity => !removed.has(entity.id));
      next.push(...additions);

      if (next.length < 8) {
        const refill = Math.max(4, Math.floor(sim.spawnCount * 0.15));
        for (let i = 0; i < refill; i += 1) next.push(createEntity(pickBaseKind()));
        pushLog(`population collapsed, spawned ${refill} new entities`);
      }

      sim.entities = next.slice(0, 260);
    }

    function step(deltaSeconds) {
      // Shorter steps keep fast decay fragments from skipping small bodies.
      let remaining = deltaSeconds;
      while (remaining > 1e-9) {
        let smallestRadius = Infinity;
        let fastestSpeed = 0;
        for (const entity of sim.entities) {
          smallestRadius = Math.min(smallestRadius, entity.radius);
          const cap = 2.8 + entity.generation * 0.1 + entity.burstSpeed;
          fastestSpeed = Math.max(fastestSpeed, Math.min(cap, Math.hypot(entity.vx, entity.vy)));
        }
        const safeStep = smallestRadius * 0.5 / Math.max(1, fastestSpeed * 60 * MOTION_SPEED);
        const duration = Math.min(remaining, safeStep);
        advancePhysics(duration);
        remaining -= duration;
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.globalCompositeOperation = "lighter";
      for (const entity of sim.entities) {
        drawEntity(entity);
      }
    }

    function frame(timestamp) {
      if (lastFrameTime === null) lastFrameTime = timestamp;
      const elapsed = Math.min(0.1, Math.max(0, (timestamp - lastFrameTime) / 1000));
      lastFrameTime = timestamp;
      if (!sim.paused) {
        accumulatedTime += elapsed;
        while (accumulatedTime + 1e-9 >= PHYSICS_STEP) {
          step(PHYSICS_STEP);
          accumulatedTime = Math.max(0, accumulatedTime - PHYSICS_STEP);
        }
        render();
      }
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", () => {
      lastFrameTime = null;
      accumulatedTime = 0;
    });
    resize();
    resetSim();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
